# 阿里云 云安全中心（Security Center）—— 基线检查风险（JSON）
# 正样本：parsers/aliyun/samples.json 中 key = aliyun-sas-baseline-json
key: aliyun-sas-baseline-json
name: 阿里云云安全中心基线风险
vendor: 阿里云
product: 云安全中心
protocols: [webhook, http-pull, kafka]
engine: json-path
pattern: |
  risk_id=$.riskId
  ts=$.lastTime
  rule_name=$.riskName
  risk=$.riskLevel
  kind=$.riskType
  host=$.instanceName
  host_id=$.instanceId
  internet_ip=$.internetIp
  intranet_ip=$.intranetIp
  status=$.status
  detail=$.detail
mapping:
  map:
    risk_id: rule.id
    ts: event.time
    rule_name: rule.name
    kind: event.category_raw
    host: host.name
    host_id: host.id
    internet_ip: destination.ip
    intranet_ip: host.ip
    detail: message
  severity_field: risk
  severity_map:
    critical: critical
    high: high
    medium: medium
    low: low
  category_map:
    baseline: configuration
    cis: configuration
  defaults:
    event.category: configuration
required_fields: [risk_id]
sample_fixture: parsers/aliyun/samples.json#aliyun-sas-baseline-json
description: 阿里云云安全中心基线检查风险推送（riskId/riskName/riskLevel/instanceName/instanceId 为公开 API 字段）。
