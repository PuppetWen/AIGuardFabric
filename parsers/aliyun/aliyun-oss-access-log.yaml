# 阿里云 对象存储 OSS —— 访问日志（每桶一条，类 Apache common log 前缀）
# 正样本：parsers/aliyun/samples.json 中 key = aliyun-oss-access-log
# 说明：OSS 访问日志公开文档记载的前若干列为
#   RemoteIP - - [Time] "Request-URI" HTTPStatus SentBytes ObjectSize TotalTime TurnAroundTime
#   "Referer" "User-Agent" - "HostID" "RequestID" ...
# 尾部列（Bucket/StorageClass/ErrorCode 等）随版本与存储类型变化，本模板只解析公开列，
# 其余内容原样保留在原始载荷（Event::raw）与 message 中，绝不丢失。
key: aliyun-oss-access-log
name: 阿里云 OSS 访问日志
vendor: 阿里云
product: OSS
protocols: [file, object-storage, beats]
engine: grok
pattern: '%{IPORHOST:client_ip} - - \[%{HTTPDATE:ts}\] "%{WORD:method} %{NOTSPACE:uri} HTTP/%{NUMBER:http_version}" %{INT:status} %{INT:sent_bytes} %{INT:object_size} %{INT:total_time_ms} %{INT:turnaround_ms} "%{DATA:referer}" "%{DATA:user_agent}"'
mapping:
  map:
    client_ip: source.ip
    ts: event.time
    method: http.request.method
    uri: url.path
    http_version: http.version
    status: http.response.status_code
    sent_bytes: http.response.body.bytes
    object_size: file.size
    total_time_ms: event.duration
    turnaround_ms: http.response.time
    referer: http.request.referrer
    user_agent: user_agent.original
  time_field: ts
  time_format: '%d/%b/%Y:%H:%M:%S %z'
  defaults:
    event.severity: info
    event.category: web
required_fields: [client_ip, status]
sample_fixture: parsers/aliyun/samples.json#aliyun-oss-access-log
description: 阿里云 OSS 访问日志（Grok 解析 RemoteIP/Time/Request-URI/HTTPStatus/SentBytes/ObjectSize/Referer/User-Agent 公开列）。
