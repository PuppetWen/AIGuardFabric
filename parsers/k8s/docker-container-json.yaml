# Docker —— 容器日志（json-file / journald 转发形态）
# 正样本：parsers/k8s/samples.json 中 key = docker-container-json
# 说明：docker 默认 json-file 日志驱动把容器 stdout/stderr 包在 log/stream/time 三字段里，
# 本模板提取采集元数据并保留日志本体为 message（容器内应用日志由应用模板二次解析）。
key: docker-container-json
name: Docker 容器日志
vendor: Docker
product: Engine
protocols: [file, beats, kafka, http-pull]
engine: json-path
pattern: |
  ts=$.time
  content=$.log
  stream=$.stream
mapping:
  map:
    ts: event.time
    content: message
    stream: log.stream
  defaults:
    event.category: process
    event.severity: info
required_fields: [content]
sample_fixture: parsers/k8s/samples.json#docker-container-json
description: Docker 容器/守护进程 JSON 日志（log/stream/time），保留原始日志本体到 message，不做二次加工。
