# AWS S3 —— 服务器访问日志（空格分隔，公开字段顺序）
# 正样本：parsers/aws/samples.json 中 key = aws-s3-access-log
# 公开列序：Bucket Owner, Bucket, Time, Remote IP, Requester, Request ID, Operation, Key,
# "Request-URI", HTTP status, Error Code, Bytes Sent, Object Size, Total Time, Turn-Around Time,
# "Referer", "User-Agent", Version Id, Host Id, Signature Version, Cipher Suite, Auth Type,
# Host Header, TLS version, ...
key: aws-s3-access-log
name: AWS S3 访问日志
vendor: AWS
product: S3
protocols: [file, object-storage, beats]
engine: grok
pattern: '%{NOTSPACE:owner} %{NOTSPACE:bucket} \[%{HTTPDATE:ts}\] %{IPORHOST:remote_ip} %{NOTSPACE:requester} %{NOTSPACE:request_id} %{NOTSPACE:operation} %{NOTSPACE:key} "%{WORD:method} %{NOTSPACE:uri} HTTP/%{NUMBER:http_version}" %{INT:status} %{NOTSPACE:error_code} %{INT:bytes_sent} %{INT:object_size} %{INT:total_time} %{INT:turnaround} "%{DATA:referer}" "%{DATA:user_agent}" %{NOTSPACE:version_id} %{NOTSPACE:host_id} %{NOTSPACE:sig_version} %{NOTSPACE:cipher} %{NOTSPACE:auth_type} %{NOTSPACE:host_header} %{NOTSPACE:tls_version}'
mapping:
  map:
    owner: cloud.account.id
    bucket: cloud.bucket
    remote_ip: source.ip
    requester: user.id
    request_id: event.id
    operation: event.action_raw
    key: file.name
    method: http.request.method
    uri: url.path
    http_version: http.version
    status: http.response.status_code
    error_code: error.code
    bytes_sent: http.response.body.bytes
    object_size: file.size
    total_time: event.duration
    turnaround: event.turnaround
    referer: http.request.referrer
    user_agent: user_agent.original
    sig_version: cloud.signature_version
    cipher: tls.cipher
    auth_type: cloud.auth_type
    host_header: url.domain
    tls_version: tls.version
  time_field: ts
  time_format: '%d/%b/%Y:%H:%M:%S %z'
  defaults:
    event.category: web
    event.severity: info
    event.action: read
required_fields: [bucket, operation]
sample_fixture: parsers/aws/samples.json#aws-s3-access-log
description: AWS S3 服务器访问日志（公开 26 列顺序），对象级访问审计与批量下载（数据外传）检测来源。
