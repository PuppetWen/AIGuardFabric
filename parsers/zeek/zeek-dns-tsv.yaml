# Zeek —— dns.log 查询日志（TSV）
# 正样本：parsers/zeek/samples.json 中 key = zeek-dns-tsv
key: zeek-dns-tsv
name: Zeek dns.log 查询日志
vendor: Zeek
product: dns.log
protocols: [file, beats]
engine: csv
pattern: 'ts,uid,id.orig_h,id.orig_p,id.resp_h,id.resp_p,proto,trans_id,rtt,query,qclass,qclass_name,qtype,qtype_name,rcode,rcode_name,AA,TC,RD,RA,Z,answers,TTLs,rejected'
mapping:
  map:
    uid: event.id
    id.orig_h: source.ip
    id.orig_p: source.port
    id.resp_h: destination.ip
    id.resp_p: destination.port
    proto: network.transport
    trans_id: dns.id
    rtt: event.duration
    query: dns.question.name
    qtype_name: dns.question.type
    rcode_name: dns.response_code
    answers: dns.answers
  time_field: ts
  time_format: unix
  defaults:
    event.severity: info
    event.category: network
required_fields: [uid, query]
sample_fixture: parsers/zeek/samples.json#zeek-dns-tsv
description: Zeek dns.log（query/qtype_name/rcode_name/answers），DNS 隧道与 C2 域名检测的原始来源。
