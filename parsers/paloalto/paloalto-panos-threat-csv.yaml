# Palo Alto PAN-OS —— THREAT 威胁日志（syslog 信封 + CSV）
# 正样本：parsers/paloalto/samples.json 中 key = paloalto-panos-threat-csv
key: paloalto-panos-threat-csv
name: PAN-OS 威胁日志（CSV）
vendor: Palo Alto
product: PAN-OS
protocols: [syslog, beats, file]
engine: csv
pattern: 'future_use,receive_time,serial,type,subtype,config_version,generate_time,src_ip,dst_ip,nat_src_ip,nat_dst_ip,rule,src_user,dst_user,app,vsys,from_zone,to_zone,inbound_if,outbound_if,log_action,time_logged,session_id,repeat_count,src_port,dst_port,nat_src_port,nat_dst_port,flags,protocol,action,url_filename,threat_id,category,severity,direction,seqno,action_flags'
mapping:
  map:
    receive_time: event.time
    serial: observer.serial_number
    type: event.category_raw
    subtype: event.type
    src_ip: source.ip
    dst_ip: destination.ip
    rule: rule.name
    src_user: user.name
    dst_user: destination.user.name
    app: network.application
    from_zone: source.zone
    to_zone: destination.zone
    session_id: network.session_id
    src_port: source.port
    dst_port: destination.port
    protocol: network.iana_number
    url_filename: url.path
    threat_id: rule.id
    category: rule.category
    direction: network.direction
    action_flags: event.action_flags
  time_field: receive_time
  time_format: '%Y/%m/%d %H:%M:%S'
  severity_field: severity
  severity_map:
    critical: critical
    high: high
    medium: medium
    low: low
    informational: info
  category_map:
    THREAT: intrusion
    TRAFFIC: network
    URL: web
  action_field: action
required_fields: [serial, threat_id]
sample_fixture: parsers/paloalto/samples.json#paloalto-panos-threat-csv
description: PAN-OS THREAT 日志（threat_id/severity/direction/url_filename），type=THREAT → intrusion。
