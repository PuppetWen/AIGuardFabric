# AIGuardFabric 检测规则 —— 敏感信息回显：银行卡号
# 安全域: model-data（模型与数据安全）｜ 检测目标: model-output ｜ 算子: all ｜ 等级: high
# 正负样本内联在 samples.positive / samples.negative：正样本必须命中、负样本必须不命中，
# 该约束由 crates/agf-scan/tests/rules_library.rs 强制（含内置负样本基线）。
# 参考: https://genai.owasp.org/llm-top-10/
key: MD-PII-007
name: 敏感信息回显：银行卡号
description: 16-19 位数字 + 卡号语境词同时出现才判定，避免命中订单号等长数字。
domain: model-data
severity: high
kind: composite
target: model-output
action: redact
enabled: true
rollout_percent: 100
tags:
- OWASP-LLM02
- PCI-DSS
- PII
references:
- https://genai.owasp.org/llm-top-10/
detection:
  type: all
  of:
  - type: regex
    pattern: '\b\d{16,19}\b'
    case_insensitive: true
    min_matches: 1
  - type: keyword
    any:
    - 卡号
    - 银行卡
    - 信用卡
    - credit card
    - card_number
    - card number
    - cardnumber
    - pan
samples:
  positive:
  - 银行卡号 6222021234567890123 有效期 12/28。
  - '{"credit_card":{"card_number":"4111111111111111","exp":"09/27"}}'
  negative:
  - 订单号 2026022110234567 已创建，请勿重复提交。
  - 信用卡申请表模板见附件，卡号栏留空由系统生成。
remediation: 支付卡数据不得进入模型上下文；输出侧对 16-19 位数字做上下文校验后脱敏。
author: agf-rules
version: 1
