# AIGuardFabric 检测规则 —— 硬编码口令/密钥（取反排除占位符）
# 安全域: credential-leak（凭证泄露）｜ 检测目标: file-content ｜ 算子: all ｜ 等级: high
# 正负样本内联在 samples.positive / samples.negative：正样本必须命中、负样本必须不命中，
# 该约束由 crates/agf-scan/tests/rules_library.rs 强制（含内置负样本基线）。
# 参考: https://cwe.mitre.org/data/definitions/798.html
key: CL-HRD-007
name: 硬编码口令/密钥（取反排除占位符）
description: 命中 key=value 形式的凭据赋值，但用 Not 排除 changeme/环境变量等合规占位写法。
domain: credential-leak
severity: high
kind: composite
target: file-content
action: redact
enabled: true
rollout_percent: 100
tags:
- CWE-798
- hardcoded-credential
references:
- https://cwe.mitre.org/data/definitions/798.html
detection:
  type: all
  of:
  - type: regex
    pattern: '(?i)(password|passwd|pwd|secret|token|api[_-]?key)\s*[:=]\s*["'']?[A-Za-z0-9!@#$%^&_\-]{8,}'
    case_insensitive: true
    min_matches: 1
  - type: not
    of:
      type: regex
      pattern: '(?i)["'']?(change[_-]?me|your[_-]?password|placeholder|xxxx+|<[A-Z_]+>|\$\{[A-Z_]+\}|env\.|process\.env)'
      case_insensitive: true
      min_matches: 1
samples:
  positive:
  - db_password="P@ssw0rd_2026_Prod!"
  - 'github_token: ghp_AbCdEfGhIjKlMnOpQrStUvWxYz0123456789'
  negative:
  - password = "${DB_PASSWORD}"（从环境变量注入，不要写死）
  - password = "changeme123"（首次登录后必须修改）
remediation: 把凭据迁移到密钥管理服务；在 CI 中启用 secret scanning 并在提交时拦截。
author: agf-rules
version: 1
