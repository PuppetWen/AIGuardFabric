# AIGuardFabric 检测规则 —— 过度 Scope 授权（通配权限）
# 安全域: tool-abuse（工具与权限滥用）｜ 检测目标: config ｜ 算子: regex ｜ 等级: high
# 正负样本内联在 samples.positive / samples.negative：正样本必须命中、负样本必须不命中，
# 该约束由 crates/agf-scan/tests/rules_library.rs 强制（含内置负样本基线）。
# 参考: https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
key: TA-SCP-007
name: 过度 Scope 授权（通配权限）
description: OAuth/工具权限申请中出现 * / full_access / 全部权限 等通配授权。
domain: tool-abuse
severity: high
kind: regex
target: config
action: approval
enabled: true
rollout_percent: 100
tags:
- OWASP-LLM06
- least-privilege
references:
- https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
detection:
  type: regex
  pattern: '(?i)(scopes?|permissions?)["'']?\s*[:=]\s*\[?\s*["'']?(\*|all|full[_-]?access|admin:\*|readwrite|全部权限|所有权限)'
  case_insensitive: true
  min_matches: 1
samples:
  positive:
  - 'oauth_scopes: ["*"]'
  - '{"permissions":"full_access"}'
  - 'required_scope: "全部权限"'
  negative:
  - 'oauth_scopes: ["kb.read","kb.write"]'
  - '{"permissions":"kb.read"}'
remediation: 禁止通配 Scope；按最小权限逐项申请并在网关侧强制校验。
author: agf-rules
version: 1
