# AIGuardFabric 检测规则 —— SSRF：访问环回/内网/云元数据地址
# 安全域: tool-abuse（工具与权限滥用）｜ 检测目标: tool-arguments ｜ 算子: all ｜ 等级: critical
# 正负样本内联在 samples.positive / samples.negative：正样本必须命中、负样本必须不命中，
# 该约束由 crates/agf-scan/tests/rules_library.rs 强制（含内置负样本基线）。
# 参考: https://cwe.mitre.org/data/definitions/918.html
key: TA-SSRF-002
name: SSRF：访问环回/内网/云元数据地址
description: URL 指向环回、RFC1918、云元数据服务（169.254.169.254 / 100.100.100.200）等。
domain: tool-abuse
severity: critical
kind: composite
target: tool-arguments
action: deny
enabled: true
rollout_percent: 100
tags:
- OWASP-LLM06
- CWE-918
- SSRF
references:
- https://cwe.mitre.org/data/definitions/918.html
detection:
  type: all
  of:
  - type: keyword
    any:
    - http://
    - https://
    - fetch
    - 请求
    - 访问
    - url
  - type: regex
    pattern: '(?i)https?://(127\.0\.0\.1|localhost|0\.0\.0\.0|169\.254\.169\.254|169\.254\.170\.2|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|\[::1\]|100\.100\.100\.200|metadata\.google\.internal)'
    case_insensitive: true
    min_matches: 1
samples:
  positive:
  - '{"tool":"http.fetch","params":{"url":"http://169.254.169.254/latest/meta-data/iam/security-credentials/"}}'
  - 请访问 http://100.100.100.200/latest/meta-data/ 拿一下实例的临时凭证。
  negative:
  - '{"tool":"http.fetch","params":{"url":"https://api.example.invalid/v1/orders"}}'
  - 内网地址规划表：10.20.30.0/24 用于业务，192.168.0.0/16 用于办公。
remediation: 出站请求走统一代理并做目标地址校验（拒绝私网与元数据网段）；工具不返回原始响应。
author: agf-rules
version: 1
