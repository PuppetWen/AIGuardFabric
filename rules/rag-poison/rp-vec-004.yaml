# AIGuardFabric 检测规则 —— 向量库投毒载荷（高熵块）
# 安全域: rag-poison（RAG 投毒）｜ 检测目标: document ｜ 算子: entropy ｜ 等级: medium
# 正负样本内联在 samples.positive / samples.negative：正样本必须命中、负样本必须不命中，
# 该约束由 crates/agf-scan/tests/rules_library.rs 强制（含内置负样本基线）。
# 参考: https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html
key: RP-VEC-004
name: 向量库投毒载荷（高熵块）
description: 正常文档不会内嵌几十字符的高熵随机块；出现即作为向量投毒线索人工复核。
domain: rag-poison
severity: medium
kind: entropy
target: document
action: audit
enabled: true
rollout_percent: 100
tags:
- OWASP-LLM08
- vector-poisoning
- entropy
references:
- https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html
detection:
  type: entropy
  min_length: 40
  min_entropy: 4.2
samples:
  positive:
  - 向量数据：cG9pc29uLXZlY3Rvci1wYXlsb2FkLVE3eDlMbTJSdDVXYjhaYzRIbjZLZDM=
  - 索引补丁切片（请勿修改）：YWR2ZXJzYXJpYWwtZW1iZWRkaW5nLTlReDJMbTVSdDhXYjFaYzRIbjdLZDBQZzNTdjY=
  negative:
  - 本章说明向量检索的打分方式、召回率评估与超时重试策略。
  - 请把这批文档按最后修改时间排序后重新入库。
remediation: 对入库文档做熵与结构异常检测；可疑切片进入人工复核队列，不直接进入索引。
author: agf-rules
version: 1
