{{/*
  ServiceAccount —— 应用 Pod 不需要访问 K8s API，默认 automountServiceAccountToken=false。
  若接入 Vault / 云 KMS 的 IRSA 式免密凭据，通过 serviceAccount.annotations 注入角色 ARN。
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agf.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agf.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
