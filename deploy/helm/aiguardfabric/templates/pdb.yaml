{{/*
  PodDisruptionBudget —— 节点排空/升级时的可用性下限
  约束：minAvailable 必须 < replicaCount，否则节点排空会永久阻塞。
        HPA 的 minReplicas 亦须 >= PDB 的 minAvailable。
  agf-scheduler 单副本，minAvailable=1 会导致排空阻塞，故默认关闭（或改用 maxUnavailable）。
*/}}

{{- if .Values.pdb.server.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agf.componentName" (dict "root" . "component" "server") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agf.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  {{- if .Values.pdb.server.minAvailable }}
  minAvailable: {{ .Values.pdb.server.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.pdb.server.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agf.componentSelectorLabels" (dict "root" . "component" "server") | nindent 6 }}
---
{{- end }}

