{{/*
  PrivateLink —— 阿里云终端节点服务（Endpoint Service）接入所需资源

  背景：
    客户 VPC 与本平台 VPC 不同，要求流量不经公网。做法是用阿里云 PrivateLink：
      客户端 VPC 建「终端节点（Endpoint）」→ 绑定本侧的「终端节点服务」→
      终端节点服务挂载本集群由 CCM 创建的**私网**负载均衡。

  本模板只负责平台侧的最小前置条件：
    为 agf-server（可选 agf-ingest）额外暴露一个带 alicloud CCM 私网注解的 Service。
    终端节点服务 / 终端节点 / 白名单仍需在控制台或 Terraform 中创建：
      {{ .Values.privateLink.service.endpointServiceNotes | indent 4 }}

  与 NetworkPolicy 的配合（安全组最小化）：
    * 私网 CLB 只监听 apiPort
    * NetworkPolicy 只放行 Ingress 控制器/Prometheus/同命名空间到 Pod
    * 终端节点服务安全组只放行对端 VPC 到 apiPort
    => 暴露面 = 单端口 + 白名单来源，而非"内网全可达"
*/}}
{{- if and .Values.privateLink.enabled .Values.privateLink.service.enabled .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agf.componentName" (dict "root" . "component" "server") }}-privatelink
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agf.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
    aiguardfabric.io/exposure: privatelink
  annotations:
    # ---- 阿里云 CCM 注解（私网 LB 是 PrivateLink 的硬前提）----
    {{- toYaml .Values.privateLink.service.annotations | nindent 4 }}
spec:
  type: LoadBalancer
  # 私网 LB 不需要 externalTrafficPolicy=Local 之外的改动；
  # Cluster 保证 Pod 未就绪时不会把流量打到坏节点
  externalTrafficPolicy: Cluster
  ports:
    - name: api
      port: {{ .Values.privateLink.service.apiPort }}
      targetPort: api
      protocol: TCP
  selector:
    {{- include "agf.componentSelectorLabels" (dict "root" . "component" "server") | nindent 4 }}
---
{{- end }}

{{- if and .Values.privateLink.enabled .Values.privateLink.ingestService.enabled .Values.ingest.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agf.componentName" (dict "root" . "component" "ingest") }}-privatelink
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agf.componentLabels" (dict "root" . "component" "ingest") | nindent 4 }}
    aiguardfabric.io/exposure: privatelink
  annotations:
    {{- toYaml .Values.privateLink.ingestService.annotations | nindent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  ports:
    - name: ingest-http
      port: {{ .Values.ports.ingestHttp }}
      targetPort: ingest-http
      protocol: TCP
  selector:
    {{- include "agf.componentSelectorLabels" (dict "root" . "component" "ingest") | nindent 4 }}
{{- end }}
