{{/*
  ServiceMonitor（Prometheus Operator CRD）

  ★ 重要：本模板使用 monitoring.coreos.com/v1，**集群必须先安装 Prometheus Operator**，
    否则 `helm install` 会因 CRD 不存在而失败。默认 serviceMonitor.enabled=false。
    无 Prometheus Operator 时，改用 Pod 注解抓取（本 Chart 已默认注入）：
      prometheus.io/scrape: "true"
      prometheus.io/port: "9100"
      prometheus.io/path: "/metrics"
    （见 templates/_helpers.tpl 的 agf.prometheusAnnotations，由 agf.prometheusAnnotations 渲染）

  指标名与实现对齐情况见 docs/pending-verification.deploy.md（PV-DEPLOY-002）。
*/}}
{{- if .Values.serviceMonitor.enabled }}
{{- if .Values.server.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "agf.componentName" (dict "root" . "component" "server") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agf.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "agf.componentSelectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  endpoints:
    - port: {{ .Values.serviceMonitor.portName }}
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      honorLabels: {{ .Values.serviceMonitor.honorLabels }}
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
{{- if .Values.ingest.enabled }}
