{{/*
  Secret：**密钥外置**的唯一落点。

  优先级：
    1) .Values.secrets.existingSecret 非空 → 本模板**不渲染任何 Secret**
       （由 Vault / External Secrets / SealedSecrets / 云 KMS 提供）
    2) 否则用 .Values.secrets.* 字面值渲染，并以 b64enc 编码

  ★ values.yaml 中 secrets.* 默认全为空串；若既无 existingSecret 又缺关键字段，
    templates/configmap.yaml 的 agf.validateSecrets 会直接 fail，杜绝弱默认密钥。

  外部 Secret 必须包含的键（键名可用 secrets.existingSecretKeys 重映射）：
    AGF_PG_PASSWORD              PostgreSQL 口令（>=12 字节）
    AGF_REDIS_PASSWORD           Redis 口令（可空；非空时应用侧需 AGF_REDIS_URL 带口令）
    AGF_CLICKHOUSE_PASSWORD      ClickHouse 口令（可空）
    AGF_S3_ACCESS_KEY            对象存储 Access Key
    AGF_S3_SECRET_KEY            对象存储 Secret Key
    AGF_JWT_SECRET               JWT 签名密钥（>=32 字节）
    AGF_MASTER_KEY_BASE64        AES-256-GCM 主密钥（base64 编码 32 字节）
    AGF_BOOTSTRAP_ADMIN_PASSWORD 引导管理员口令（可空 = 首启随机生成）
    AGF_ALIYUN_ACCESS_KEY_ID     阿里云 AK（可选）
    AGF_ALIYUN_ACCESS_KEY_SECRET 阿里云 SK（可选）
    AGF_ALIYUN_STS_TOKEN         阿里云 STS 临时令牌（可选，优先于 AK/SK）
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agf.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agf.labels" . | nindent 4 }}
  annotations:
    # 提示：Helm 默认会在 upgrade 时复用已有 Secret（helm.sh/resource-policy 未设置时）。
    # 若要禁止自动删除（helm uninstall 保留），可取消下面注释：
    # helm.sh/resource-policy: keep
    aiguardfabric.io/managed-by: "helm"
type: Opaque
data:
  AGF_PG_PASSWORD: {{ required "secrets.pgPassword 必填（或改用 secrets.existingSecret）" .Values.secrets.pgPassword | b64enc | quote }}
  AGF_JWT_SECRET: {{ required "secrets.jwtSecret 必填（>=32 字节，或改用 secrets.existingSecret）" .Values.secrets.jwtSecret | b64enc | quote }}
  AGF_MASTER_KEY_BASE64: {{ required "secrets.masterKeyBase64 必填（base64 32 字节，或改用 secrets.existingSecret）" .Values.secrets.masterKeyBase64 | b64enc | quote }}
  AGF_S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | b64enc | quote }}
  AGF_S3_SECRET_KEY: {{ required "secrets.s3SecretKey 必填（或改用 secrets.existingSecret）" .Values.secrets.s3SecretKey | b64enc | quote }}
  AGF_CLICKHOUSE_PASSWORD: {{ .Values.secrets.clickhousePassword | b64enc | quote }}
  AGF_REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
  AGF_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secrets.bootstrapAdminPassword | b64enc | quote }}
  AGF_ALIYUN_ACCESS_KEY_ID: {{ .Values.secrets.aliyunAccessKeyId | b64enc | quote }}
  AGF_ALIYUN_ACCESS_KEY_SECRET: {{ .Values.secrets.aliyunAccessKeySecret | b64enc | quote }}
  AGF_ALIYUN_STS_TOKEN: {{ .Values.secrets.aliyunStsToken | b64enc | quote }}
  {{- if .Values.secrets.redisPassword }}
  {{- /* Redis 口令非空时，配置里必须用带口令的 URL；这里由模板拼装，避免口令进 ConfigMap。
         应用读取 AGF_REDIS_URL（Secret 优先于 ConfigMap 的同名键）。
         host:port 从 config.AGF_REDIS_URL 中解析，保持单一事实来源。*/}}
  {{- $u := .Values.config.AGF_REDIS_URL -}}
  {{- $u = trimPrefix "redis://" $u -}}
  {{- $u = trimPrefix "rediss://" $u -}}
  {{- $hostPort := first (splitList "/" $u) -}}
  AGF_REDIS_URL: {{ printf "redis://:%s@%s" .Values.secrets.redisPassword $hostPort | b64enc | quote }}
  {{- end }}
{{- end }}
