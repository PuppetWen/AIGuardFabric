{{/*
  内置 MinIO（S3 兼容对象存储）—— 可选组件，默认关闭
  事实来源：docker-compose.yml 的 minio + minio-init（建桶：agf-evidence / agf-raw-logs / agf-reports）
  ★ 生产建议使用阿里云 OSS / AWS S3，并置 minio.enabled=false。
*/}}
{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agf.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agf.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  type: {{ .Values.minio.service.type }}
  ports:
    - name: s3
      port: {{ .Values.minio.service.port }}
      targetPort: s3
      protocol: TCP
    - name: console
      port: {{ .Values.minio.service.consolePort }}
      targetPort: console
      protocol: TCP
  selector:
    {{- include "agf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agf.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agf.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ include "agf.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "agf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "agf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: "{{ if .Values.global.imageRegistry }}{{ trimSuffix "/" .Values.global.imageRegistry }}/{{ end }}{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          args:
            {{- toYaml .Values.minio.command | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "agf.secretName" . }}
                  key: {{ include "agf.secretKey" (dict "root" . "key" "AGF_S3_ACCESS_KEY") }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agf.secretName" . }}
                  key: {{ include "agf.secretKey" (dict "root" . "key" "AGF_S3_SECRET_KEY") }}
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if .Values.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.minio.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size }}
        {{- if .Values.minio.persistence.storageClass }}
        storageClassName: {{ .Values.minio.persistence.storageClass | quote }}
        {{- end }}
  {{- else }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  {{- end }}
{{- end }}

{{- if and .Values.minio.enabled .Values.minio.initBuckets.enabled }}
{{/*
  建桶 Job —— 对应 compose 的 minio-init：
    mc mb --ignore-existing agf/<bucket>，并把证据桶设为私有（anonymous set none）
  hook 语义：post-install/post-upgrade 执行一次；失败不阻塞发布（hook-delete-policy 清理）
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agf.fullname" . }}-minio-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agf.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "agf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: "{{ if .Values.global.imageRegistry }}{{ trimSuffix "/" .Values.global.imageRegistry }}/{{ end }}{{ .Values.minio.initBuckets.image.repository }}:{{ .Values.minio.initBuckets.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            {{- /* 说明：mc 的别名在脚本里用 `mc alias set` 显式设置，
                   不依赖 MC_HOST_* 隐式环境变量，避免凭据出现在进程环境快照中。 */}}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agf.secretName" . }}
                  key: {{ include "agf.secretKey" (dict "root" . "key" "AGF_S3_ACCESS_KEY") }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agf.secretName" . }}
                  key: {{ include "agf.secretKey" (dict "root" . "key" "AGF_S3_SECRET_KEY") }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # 等待 MinIO 就绪
              for i in $(seq 1 30); do
                if mc ready agf 2>/dev/null; then break; fi
                echo "[minio-init] 等待 MinIO 就绪 ($i/30)"
                sleep 5
              done
              mc alias set agf "http://{{ include "agf.fullname" . }}-minio:{{ .Values.minio.service.port }}" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
              {{- range .Values.minio.initBuckets.buckets }}
              mc mb --ignore-existing "agf/{{ . }}"
              {{- end }}
              # 证据桶保持私有（禁止匿名读）
              mc anonymous set none "agf/{{ .Values.config.AGF_S3_BUCKET }}"
              echo "[minio-init] 桶已就绪"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
{{- end }}
