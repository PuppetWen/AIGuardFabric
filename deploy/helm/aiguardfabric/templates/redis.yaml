{{/*
  内置 Redis —— 可选组件，默认关闭
  事实来源：docker-compose.yml 的 redis 服务（appendonly / maxmemory / allkeys-lru）
  ★ 生产建议使用云 Redis（Tair 等）并置 redis.enabled=false。
*/}}
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agf.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agf.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: {{ .Values.redis.service.type }}
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "agf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agf.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agf.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "agf.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "agf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "agf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999         # redis 镜像内置 redis 用户
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "{{ if .Values.global.imageRegistry }}{{ trimSuffix "/" .Values.global.imageRegistry }}/{{ end }}{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          args:
            {{- toYaml .Values.redis.command | nindent 12 }}
            {{- if .Values.secrets.redisPassword }}
            # 口令非空时追加 requirepass（口令经 Secret 注入，不落 ConfigMap）
            - --requirepass
            - $(AGF_REDIS_PASSWORD)
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: AGF_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agf.secretName" . }}
                  key: {{ include "agf.secretKey" (dict "root" . "key" "AGF_REDIS_PASSWORD") }}
                  optional: true
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if .Values.redis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.redis.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
        {{- if .Values.redis.persistence.storageClass }}
        storageClassName: {{ .Values.redis.persistence.storageClass | quote }}
        {{- end }}
  {{- else }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  {{- end }}
{{- end }}
