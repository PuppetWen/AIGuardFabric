# AIGuardFabric 控制台 nginx 配置（非 root 运行，监听 8080）
# - 静态资源长缓存 + 带 hash 的产物
# - /api 与 /ws 反代到 agf-server（同源部署，避免 CORS 与令牌泄露）
# - 安全响应头（TLS 由前置 Ingress/SLB 承担）
#
# ⚠️ 为什么不用 `upstream` 块：nginx 只在**启动时**解析一次 upstream 里的主机名。
# 单独重建 `agf-server`（`docker compose up -d agf-server`）会分配新 IP，而 nginx 仍指向旧 IP，
# 表现为控制台所有接口 **502 Bad Gateway**（实测踩过：重建 server 后 :8081 全站 502，直连 :8080 正常）。
# 因此改为「Docker 内嵌 DNS + 变量 proxy_pass」，每 10s 重新解析，容器重建后自动跟上。
# 代价是失去 upstream keepalive——对本平台的同源控制台流量可以接受。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 不暴露版本号
    server_tokens off;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 前端为自建 SPA，禁止外部脚本；按需放宽 connect-src
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # 资产台账与构建目录同名；精确匹配页面地址，避免落入静态目录后返回 404。
    # 内部转到 index.html，同时沿用入口页的 no-store 缓存策略。
    location = /assets {
        rewrite ^ /index.html last;
    }

    location = /assets/ {
        rewrite ^ /index.html last;
    }

    # Asset UUID permalinks are SPA pages. A plain /assets/ prefix below would
    # mistake them for hashed static files and return nginx's 404 on refresh.
    location ~* "^/assets/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/?$" {
        rewrite ^ /index.html last;
    }

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~ ^/(api/|v1/|downloads/) {
        set $agf_upstream http://agf-server:8080;
        proxy_pass $agf_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 流式（SSE / 大模型流式转发）必须关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 32m;
    }

    location /ws {
        set $agf_upstream http://agf-server:8080;
        proxy_pass $agf_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        set $agf_upstream http://agf-server:8080;
        proxy_pass $agf_upstream/healthz;
        access_log off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
