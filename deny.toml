# =============================================================================
# cargo-deny 配置（依赖合规与安全审计）
#
# 门禁：cargo deny check
# 安装（项目内，不污染全局）：
#   cargo install --root tools cargo-deny --locked
#   tools\bin\cargo-deny.exe check
# =============================================================================

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = true

[output]
feature-depth = 1

# -----------------------------------------------------------------------------
# 许可证白名单（商用合规：Apache-2.0 项目可用的宽松许可证）
# -----------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "0BSD",
    # MQTT-over-WebSocket（`rumqttc` 的 `websocket` 特性）依赖链采用 Unlicense：
    #   rumqttc/ws → ws_stream_tungstenite → async_io_stream / pharos → Unlicense。
    # Unlicense 是**放弃著作权的公共领域声明**（比 MIT 更宽松：无署名、无版权保留义务），
    # 与本项目 Apache-2.0 无任何冲突，可安全用于商用交付。该链是本轮新增能力引入的
    # （`git show HEAD:Cargo.lock` 里没有这三个 crate），不是历史遗留。
    "Unlicense",
]
exceptions = [
    # 这些 crate 的许可证字段写法不规范，明确放行并记录
    { name = "ring", allow = ["OpenSSL", "ISC", "MIT", "Apache-2.0"] },
    { name = "webpki-roots", allow = ["MPL-2.0"] },
    { name = "r-efi", allow = ["MIT", "Apache-2.0", "BSD-3-Clause"] },
]
private = { ignore = true }

# 传染性许可证（GPL/AGPL 等）**不需要显式 deny**：`allow` 是白名单，未列入即拒绝。
# cargo-deny 0.20 起移除了 `[[licenses.deny]]`（见上游 PR #611），
# 因此 GPL/AGPL 由"不在 allow 列表里"这一条规则兜住。

# -----------------------------------------------------------------------------
# 安全公告（RUSTSEC）
# -----------------------------------------------------------------------------
[advisories]
version = 2
ignore = [
    # 每条 ignore 必须写明原因与到期复核日期，禁止长期无理由忽略。
    # 保留以下 10 条既有例外的范围与理由，不增加新的漏洞忽略。
    # YARA-X 的项目内上游副本已准备改用 Wasmtime 48.0.5，原 Wasmtime 45 的
    # RUSTSEC-2026-0222 / -0269 忽略已删除；升级的实际联合验证见 PV-019。
    # 其余既有问题来自 aws-smithy 固定的 h2 0.3 / rustls 0.21，或上游未维护的
    # bincode / paste / rustls-pemfile，以及没有已修复版本的 rsa。
    # 影响面与缓解见 docs/pending-verification.md PV-019。
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 由 aws-smithy-http-client 固定，AWS SDK 未提供升级路径；仅用于访问受控的 S3/STS 端点。复核 2026-12-31" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101.7/0.102.8 由 aws-smithy（rustls 0.21）与 async-nats 固定；0.103 已升级到 0.103.15。复核 2026-12-31" },
    { id = "RUSTSEC-2026-0099", reason = "同 RUSTSEC-2026-0098：旧 rustls 链的通配符名称约束缺陷，等待上游切到 rustls 0.23。复核 2026-12-31" },
    { id = "RUSTSEC-2026-0104", reason = "同 RUSTSEC-2026-0098：旧 rustls 链的 CRL 解析 panic（需恶意 CRL，我们未启用 CRL 校验）。复核 2026-12-31" },
    { id = "RUSTSEC-2026-0049", reason = "同 RUSTSEC-2026-0098：CRL Distribution Point 匹配缺陷，我们未启用 CRL 校验。复核 2026-12-31" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 2.0.1（yara-x 传递依赖）上游归档且无安全升级；仅用于 YARA 字节码序列化，不反序列化不可信输入。复核 2026-12-31" },
    { id = "RUSTSEC-2024-0436", reason = "paste（yara-x-macros 传递依赖）已归档但功能稳定；纯编译期宏，无运行时暴露面。复核 2026-12-31" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile（aws-smithy / rustls 链）上游归档；仅解析受控配置里的 PEM 文件。复核 2026-12-31" },
    # 12) rsa 0.9.10：原由 `sqlx-mysql` 传递引入；SAML SP 现在也直接使用它生成签名密钥。
    #     advisory 自述 `patched = []`（截至 2026-09-12 的 0.9.10 与 0.10.0-rc.18 都未修）：
    #     Marvin 攻击要求攻击者能观测到 RSA **解密**的时序；SAML 只调用密钥生成和签名，
    #     平台当前没有调用此 crate 的 RSA 解密路径。上游尚无修复版本，持续复核。
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 现用于 SAML SP 密钥生成及既有 sqlx-mysql 依赖；没有调用 RSA 解密路径，上游无修复版本。复核 2026-12-31" },
]
yanked = "warn"
# 取值口径随 cargo-deny 0.20 变更：`all` = 全部依赖（含传递依赖）都检查未维护告警。
# 这里选 `all` 而不是 `workspace`，因为传递依赖里的未维护 crate 同样会进入交付物。
unmaintained = "all"
# 注：0.20 起移除了 `vulnerability = "deny"` 键——漏洞现在默认按 deny 处理，
# 需要放行时才在 `ignore` 里逐条写明原因与复核日期。

# -----------------------------------------------------------------------------
# 依赖来源（禁止 git 直连与未知 registry）
# -----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# -----------------------------------------------------------------------------
# 重复依赖（同一 crate 多版本）：仅告警，避免阻塞构建
# -----------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# 明确禁止的高风险/不合规 crate
deny = [
    # 未维护的 TLS/加密实现
    { name = "openssl", reason = "统一使用 rustls，避免系统 OpenSSL 依赖" },
    { name = "native-tls", reason = "统一使用 rustls" },
    # 已知恶意的 typosquat 示例（保持清单结构，便于后续补充）
]
skip = []
skip-tree = []
