sha2.workspace = true
hex.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
toml.workspace = true
serde_yaml.workspace = true
# 上行令牌以 SecretString 承载（Debug 掩码、Drop 清零），与 agf-core/agf-storage 口径一致
secrecy.workspace = true
# mTLS 上行（`client::tls*`）：rustls 装配客户端身份 + tokio-rustls 驱动握手。
# 刻意不用 reqwest 的 `Identity`：那条路径无法同时表达"跳过校验"与"证书即身份对象"。
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
# 端到端 mTLS 测试需要在**进程内**起一个真 rustls 服务端（要求并读取客户端证书），
# 因此测试侧生成自签 PKI：不依赖本机 openssl，也不依赖外部进程。
rcgen.workspace = true

[lints]
workspace = true
